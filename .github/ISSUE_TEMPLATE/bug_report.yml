name: Bug report
description: Something does not work as expected
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the mind chat ...
        2. Click ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Extension version
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: "Chrome 130, macOS 15"
  - type: input
    id: profile
    attributes:
      label: Profile
      description: Built-in profile or your own (attach it if you can).
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or console output
      description: Please remove private chat content first.
